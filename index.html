<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#202421"><link rel="manifest" href="manifest.json"><title>Ma cave à vin</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#f7f3eb;background:#171a18}*{box-sizing:border-box}body{margin:0}header{padding:20px 16px;background:#252b27;border-bottom:1px solid #454b45}h1{margin:0;font-size:1.5rem}header p{margin:5px 0 0;color:#c7c9c3}.wrap{max-width:850px;margin:auto;padding:16px}.shelves{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin:12px 0 18px}.comp{min-height:94px;border:2px solid var(--c);border-radius:10px;background:#252b27;color:#fff;padding:10px 4px;cursor:pointer}.comp strong{display:block;font-size:1.3rem}.comp small{font-size:.75rem;color:#d7d9d2}.comp.active{background:#3a443d;box-shadow:0 0 0 2px #f7f3eb inset}section.panel{background:#252b27;border:1px solid #454b45;border-radius:12px;padding:16px;margin:12px 0}h2{margin:0 0 12px;font-size:1.15rem}label{display:block;font-size:.88rem;color:#d7d9d2;margin:10px 0 5px}input,select,textarea,button{font:inherit}input,select,textarea{width:100%;padding:10px;border-radius:8px;border:1px solid #656b64;background:#171a18;color:#fff}textarea{min-height:70px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.btn{border:0;border-radius:8px;padding:11px 14px;background:#b9d0a8;color:#172016;font-weight:700;cursor:pointer;margin-top:12px}.secondary{background:#414a43;color:#fff}.danger{background:#713d36;color:white}.bottle{padding:12px;border:1px solid #454b45;border-radius:8px;margin:8px 0}.bottle strong{display:block}.muted{color:#c7c9c3;font-size:.9rem}.topline{display:flex;justify-content:space-between;align-items:center;gap:8px}.topline button{margin:0}@media(max-width:520px){.shelves{grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}.comp{min-height:78px;padding:6px 2px}.comp small{font-size:.65rem}.grid{grid-template-columns:1fr}.wrap{padding:10px}}
</style></head><body>
<header><h1>🍷 Ma cave à vin</h1><p>Ton inventaire, conservé sur cet appareil</p></header>
<main class="wrap"><h2>Choisis un compartiment</h2><div class="shelves" id="shelves"></div><section class="panel"><div class="topline"><h2 id="compTitle">Compartiment 1</h2><span id="count" class="muted"></span></div><div id="bottles"></div></section>
<section class="panel"><h2 id="formTitle">Ajouter une bouteille</h2><form id="wineForm"><input type="hidden" id="editId"><div class="grid"><div><label for="name">Nom du vin *</label><input id="name" required></div><div><label for="producer">Producteur</label><input id="producer"></div><div><label for="appellation">Appellation</label><input id="appellation"></div><div><label for="year">Millésime</label><input id="year" inputmode="numeric" type="number" min="1900" max="2100"></div><div><label for="color">Couleur</label><select id="color"><option>Rouge</option><option>Blanc</option><option>Rosé</option><option>Effervescent</option><option>Autre</option></select></div><div><label for="qty">Quantité *</label><input id="qty" type="number" min="1" value="1" required></div><div><label for="price">Prix par bouteille (€)</label><input id="price" type="number" min="0" step="0.01"></div><div><label for="drink">À boire idéalement jusqu'au</label><input id="drink" type="date"></div><div><label for="temp">Température de service (°C)</label><input id="temp" type="number" min="0" max="30"></div><div><label for="photo">Photo (facultative)</label><input id="photo" type="file" accept="image/*"></div></div><label for="notes">Notes</label><textarea id="notes"></textarea><button class="btn" type="submit">Enregistrer la bouteille</button> <button class="btn secondary" type="button" id="cancelEdit" hidden>Annuler modification</button></form></section>
<section class="panel"><h2>Gestion</h2><p class="muted">Les données restent dans le stockage de ce navigateur. Exporte régulièrement une sauvegarde.</p><div class="grid"><div><label for="capacity">Capacité du compartiment sélectionné</label><input id="capacity" type="number" min="1" max="500" value="24"><button class="btn secondary" id="saveCapacity">Enregistrer capacité</button></div><div><label for="importFile">Restaurer une sauvegarde JSON</label><input id="importFile" type="file" accept="application/json"><button class="btn secondary" id="export">Exporter ma cave</button></div></div></section></main>
<script>
const KEY='maCaveVin_v1';let state=JSON.parse(localStorage.getItem(KEY)||'null')||{selected:1,capacities:{1:24,2:24,3:24,4:24,5:24},wines:[]};let currentPhoto=null;const $=id=>document.getElementById(id);const save=()=>localStorage.setItem(KEY,JSON.stringify(state));const inComp=n=>state.wines.filter(w=>w.compartment===n).reduce((s,w)=>s+Number(w.qty),0);
function render(){ $('shelves').innerHTML=[1,2,3,4,5].map(n=>`<button class="comp ${state.selected===n?'active':''}" style="--c:${['#75a66c','#77a9c7','#d9a04f','#b08ad1','#d46e64'][n-1]}" data-comp="${n}"><strong>${n}</strong><small>${inComp(n)} / ${state.capacities[n]} bouteilles</small></button>`).join('');document.querySelectorAll('[data-comp]').forEach(b=>b.onclick=()=>{state.selected=+b.dataset.comp;save();render()});$('compTitle').textContent='Compartiment '+state.selected;$('count').textContent=`${inComp(state.selected)} bouteille(s)`;$('capacity').value=state.capacities[state.selected];let wines=state.wines.filter(w=>w.compartment===state.selected);$('bottles').innerHTML=wines.length?wines.map(w=>`<div class="bottle"><div class="topline"><strong>${esc(w.name)} ${w.year?'('+w.year+')':''}</strong><span>${w.qty} ×</span></div><div class="muted">${esc([w.producer,w.appellation,w.color].filter(Boolean).join(' · '))}</div><div class="muted">${w.price?'Prix : '+w.price+' € · ':''}${w.drink?'À boire jusqu’au '+w.drink+' · ':''}${w.temp?'Service : '+w.temp+' °C':''}</div>${w.notes?`<p>${esc(w.notes)}</p>`:''}${w.photo?`<img src="${w.photo}" alt="Photo de ${esc(w.name)}" style="max-width:100%;max-height:180px;border-radius:8px">`:''}<div><button class="btn secondary" onclick="editWine('${w.id}')">Modifier</button> <button class="btn danger" onclick="removeWine('${w.id}')">Retirer</button> <button class="btn secondary" onclick="moveWine('${w.id}')">Déplacer</button></div></div>`).join(''):'<p class="muted">Aucune bouteille dans ce compartiment pour le moment.</p>';}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
$('photo').addEventListener('change',()=>{let f=$('photo').files[0];if(!f){currentPhoto=null;return}if(f.size>1200000){alert('Choisis une photo de moins de 1,2 Mo pour éviter de saturer le stockage du téléphone.');$('photo').value='';currentPhoto=null;return}let r=new FileReader();r.onload=()=>currentPhoto=r.result;r.readAsDataURL(f)});
$('wineForm').onsubmit=e=>{e.preventDefault();let id=$('editId').value||crypto.randomUUID();let old=state.wines.find(w=>w.id===id);let w={id,compartment:state.selected,name:$('name').value.trim(),producer:$('producer').value.trim(),appellation:$('appellation').value.trim(),year:$('year').value,color:$('color').value,qty:+$('qty').value,price:$('price').value,drink:$('drink').value,temp:$('temp').value,notes:$('notes').value.trim(),photo:currentPhoto!==null?currentPhoto:(old?.photo||'')};if(old)state.wines=state.wines.filter(x=>x.id!==id);state.wines.push(w);save();e.target.reset();$('editId').value='';$('qty').value=1;currentPhoto=null;$('cancelEdit').hidden=true;$('formTitle').textContent='Ajouter une bouteille';render()};
window.editWine=id=>{let w=state.wines.find(x=>x.id===id);if(!w)return;state.selected=w.compartment;['name','producer','appellation','year','color','qty','price','drink','temp','notes'].forEach(k=>$(k).value=w[k]||'');$('editId').value=id;currentPhoto=w.photo||null;$('formTitle').textContent='Modifier une bouteille';$('cancelEdit').hidden=false;render();$('wineForm').scrollIntoView({behavior:'smooth'})};window.removeWine=id=>{if(confirm('Retirer cette entrée de la cave ?')){state.wines=state.wines.filter(w=>w.id!==id);save();render()}};window.moveWine=id=>{let n=prompt('Déplacer vers le compartiment (1 à 5) :',String(state.selected));if(n===null)return;n=Number(n);if(![1,2,3,4,5].includes(n)){alert('Choisis un numéro de 1 à 5.');return}let w=state.wines.find(x=>x.id===id);if(w){w.compartment=n;state.selected=n;save();render()}};$('cancelEdit').onclick=()=>{ $('wineForm').reset();$('editId').value='';$('qty').value=1;currentPhoto=null;$('formTitle').textContent='Ajouter une bouteille';$('cancelEdit').hidden=true};$('saveCapacity').onclick=()=>{let n=+$('capacity').value;if(n<inComp(state.selected)){alert('La capacité ne peut pas être inférieure au nombre de bouteilles actuellement présent.');return}state.capacities[state.selected]=n;save();render()};$('export').onclick=()=>{let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='ma-cave-a-vin-sauvegarde.json';a.click();URL.revokeObjectURL(a.href)};$('importFile').onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let s=JSON.parse(r.result);if(!s.wines||!s.capacities)throw Error();state=s;save();render();alert('Sauvegarde restaurée.')}catch{alert('Fichier de sauvegarde invalide.')}};r.readAsText(f)};render();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
